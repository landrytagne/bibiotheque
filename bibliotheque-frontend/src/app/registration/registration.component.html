<div class="page-form">
    <div class="card form-card">
        <div class="card-body">
            <h3 class="text-center form-title"> Ajouter un utilisateur </h3>

            <div *ngIf="errorMessage" class="alert alert-danger" role="alert">
                {{ errorMessage }}
            </div>

            <form (ngSubmit)="onSubmit()" autocomplete="off">

                <div class="form-group mb-3">
                    <label> Nom </label>
                    <input type="text" class="form-control" id="name" [(ngModel)]="user.name" name="name" placeholder="Nom complet">
                </div>

                <div class="form-group mb-3">
                    <label> Nom d'utilisateur </label>
                    <input type="text" class="form-control" id="username" [(ngModel)]="user.username" name="username" placeholder="nom.dutilisateur">
                </div>

                <div class="form-group mb-3">
                    <label> Mot de passe </label>
                    <input type="password" class="form-control" id="password" [(ngModel)]="user.password" name="password" placeholder="Mot de passe">
                </div>

                <div class="form-group mb-4">
                    <label> Rôle </label>
                    <select class="form-control" [(ngModel)]="selectedRole" name="role">
                        <option *ngFor="let option of roleOptions" [ngValue]="option">{{ option }}</option>
                    </select>
                </div>

                <button class="btn btn-primary w-100" type="submit" [disabled]="!formValid() || submitted">
                    {{ submitted ? 'Création en cours...' : 'Créer l\'utilisateur' }}
                </button>
            </form>
        </div>
    </div>
</div>
