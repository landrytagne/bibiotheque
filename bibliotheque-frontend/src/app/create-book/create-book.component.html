<div class="page-form">
    <div class="card form-card">
        <div class="card-body">
            <h3 class="text-center form-title"> Ajouter un livre </h3>
            <form (ngSubmit)="onSubmit()" autocomplete="off">

                <div class="form-group mb-3">
                    <label> Titre </label>
                    <input type="text" class="form-control" id="bookName" [(ngModel)]="book.bookName" name="bookName" placeholder="Titre du livre">
                </div>

                <div class="form-group mb-3">
                    <label> Auteur </label>
                    <input type="text" class="form-control" id="bookAuthor" [(ngModel)]="book.bookAuthor" name="bookAuthor" placeholder="Nom de l'auteur">
                </div>

                <div class="form-group mb-3">
                    <label> Genre </label>
                    <input type="text" class="form-control" id="bookGenre" [(ngModel)]="book.bookGenre" name="bookGenre" placeholder="Genre (roman, essai...)">
                </div>

                <div class="form-group mb-4">
                    <label> Nombre d'exemplaires </label>
                    <input type="number" class="form-control" id="noOfCopies" [(ngModel)]="book.noOfCopies" name="noOfCopies" placeholder="0">
                </div>

                <button class="btn btn-primary w-100" type="submit"> Ajouter le livre </button>
            </form>
        </div>
    </div>
</div>
