<div class="page-form animate-fade-in-up">
  <div class="card form-card">
    <div class="form-card-header">
      <div class="form-header-icon">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/><line x1="12" y1="6" x2="12" y2="14"/><line x1="8" y1="10" x2="16" y2="10"/></svg>
      </div>
      <h3 class="form-title">Ajouter un livre</h3>
      <p class="form-subtitle">Remplissez les informations du nouveau livre</p>
    </div>

    <div class="card-body">
      <form (ngSubmit)="onSubmit()" autocomplete="off">
        <div class="input-group-custom">
          <label>Titre</label>
          <div class="input-wrapper">
            <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
            <input type="text" class="form-control" id="bookName" [(ngModel)]="book.bookName" name="bookName" placeholder="Titre du livre">
          </div>
        </div>

        <div class="input-group-custom">
          <label>Auteur</label>
          <div class="input-wrapper">
            <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            <input type="text" class="form-control" id="bookAuthor" [(ngModel)]="book.bookAuthor" name="bookAuthor" placeholder="Nom de l'auteur">
          </div>
        </div>

        <div class="row">
          <div class="col-md-6">
            <div class="input-group-custom">
              <label>Genre</label>
              <div class="input-wrapper">
                <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h7"/></svg>
                <input type="text" class="form-control" id="bookGenre" [(ngModel)]="book.bookGenre" name="bookGenre" placeholder="Roman, Essai...">
              </div>
            </div>
          </div>
          <div class="col-md-6">
            <div class="input-group-custom">
              <label>Exemplaires</label>
              <div class="input-wrapper">
                <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>
                <input type="number" class="form-control" id="noOfCopies" [(ngModel)]="book.noOfCopies" name="noOfCopies" placeholder="0">
              </div>
            </div>
          </div>
        </div>

        <button class="btn btn-primary w-100 btn-submit" type="submit">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          Ajouter le livre
        </button>
      </form>
    </div>
  </div>
</div>
