<header>
  <nav class="navbar navbar-expand-lg navbar-dark main-navbar">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">
        <span class="brand-badge">📚</span> Bibliothèque
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarSupportedContent">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">

          <li class="nav-item">
            <a routerLink="/books" routerLinkActive="active" class="nav-link" *ngIf="userService.roleMatch(['Admin'])">Livres</a>
          </li>

          <li class="nav-item">
            <a routerLink="/create-book" routerLinkActive="active" class="nav-link" *ngIf="userService.roleMatch(['Admin'])">Ajouter un livre</a>
          </li>

          <li class="nav-item">
            <a routerLink="/users" routerLinkActive="active" class="nav-link" *ngIf="userService.roleMatch(['Admin'])">Utilisateurs</a>
          </li>

          <li class="nav-item">
            <a routerLink="/register-user" routerLinkActive="active" class="nav-link" *ngIf="userService.roleMatch(['Admin'])">Inscrire un utilisateur</a>
          </li>

          <li class="nav-item">
            <a routerLink="/borrow-book" routerLinkActive="active" class="nav-link" *ngIf="userService.roleMatch(['User'])">Emprunter</a>
          </li>

          <li class="nav-item">
            <a routerLink="/return-book" routerLinkActive="active" class="nav-link" *ngIf="userService.roleMatch(['User'])">Retourner</a>
          </li>

          <li class="nav-item">
            <a routerLink="/reservations" routerLinkActive="active" class="nav-link" *ngIf="userService.roleMatch(['Admin']) || userService.roleMatch(['User'])">Réservations</a>
          </li>

        </ul>
        <div class="d-flex align-items-center" *ngIf="isLoggedIn()">
          <span class="navbar-text me-3">
            👋 <strong>{{ name }}</strong>
          </span>
          <button type="button" class="btn btn-outline-light btn-sm" (click)="logout()">Se déconnecter</button>
        </div>
        <button *ngIf="!isLoggedIn()" type="button" class="btn btn-success btn-sm" routerLink="/login">Connexion</button>
      </div>
    </div>
  </nav>
</header>
