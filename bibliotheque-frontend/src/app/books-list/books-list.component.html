<div class="animate-fade-in-up">
  <div class="page-header">
    <div>
      <h2 class="page-title">Liste des livres</h2>
      <p class="page-subtitle">{{ books.length }} livre{{ books.length > 1 ? 's' : '' }} dans le catalogue</p>
    </div>
  </div>

  <div class="card">
    <div class="card-body">
      <div class="table-responsive">
        <table class="table align-middle">
          <thead>
            <tr>
              <th>ID</th>
              <th>Titre</th>
              <th>Auteur</th>
              <th>Genre</th>
              <th>Exemplaires</th>
              <th class="text-end">Actions</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let book of books" class="animate-fade-in">
              <td>
                <span class="id-badge">#{{ book.bookId }}</span>
              </td>
              <td>
                <div class="book-title-cell">
                  <strong>{{ book.bookName }}</strong>
                </div>
              </td>
              <td>
                <span class="author-text">{{ book.bookAuthor }}</span>
              </td>
              <td>
                <span class="badge genre-badge">{{ book.bookGenre }}</span>
              </td>
              <td>
                <span class="count-badge" [ngClass]="book.noOfCopies > 0 ? 'count-available' : 'count-unavailable'">
                  {{ book.noOfCopies }}
                </span>
              </td>
              <td class="text-end">
                <div class="action-btns">
                  <button (click)="bookDetails(book.bookId)" class="btn btn-sm btn-outline-success" title="Voir détails">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                    Voir
                  </button>
                  <button (click)="updateBook(book.bookId)" class="btn btn-sm btn-outline-primary" title="Modifier">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
                    Modifier
                  </button>
                  <button (click)="deleteBook(book.bookId)" class="btn btn-sm btn-outline-danger" title="Supprimer">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
                    Supprimer
                  </button>
                </div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>

      <div *ngIf="books.length === 0" class="empty-state">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
        <p>Aucun livre dans le catalogue</p>
      </div>
    </div>
  </div>
</div>
