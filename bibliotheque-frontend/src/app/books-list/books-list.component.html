<h2 class="page-title">Liste des livres</h2>

<div class="card">
    <div class="card-body">
        <div class="table-responsive">
            <table class="table align-middle">
                <thead>
                    <tr>
                        <th> ID </th>
                        <th> Titre </th>
                        <th> Auteur </th>
                        <th> Genre </th>
                        <th> Exemplaires </th>
                        <th> Actions </th>
                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor="let book of books">
                        <td> {{ book.bookId }} </td>
                        <td> <strong>{{ book.bookName }}</strong> </td>
                        <td> {{ book.bookAuthor }} </td>
                        <td>
                            <span class="badge rounded-pill genre-badge">{{ book.bookGenre }}</span>
                        </td>
                        <td>
                            <span class="badge rounded-pill count-badge" [ngClass]="book.noOfCopies > 0 ? 'count-available' : 'count-unavailable'">
                                {{ book.noOfCopies }}
                            </span>
                        </td>
                        <td>
                            <button (click)="bookDetails(book.bookId)" class="btn btn-sm btn-outline-success">Voir</button>
                            <button (click)="updateBook(book.bookId)" class="btn btn-sm btn-outline-primary" style="margin-left: 5px">Modifier</button>
                            <button (click)="deleteBook(book.bookId)" class="btn btn-sm btn-outline-danger" style="margin-left: 5px">Supprimer</button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
