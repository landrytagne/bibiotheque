<div class="reservation-list-section">
  <div class="filter-bar">
    <div class="filter-label">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg>
      Filtrer par statut
    </div>
    <div class="filter-chips">
      <button *ngFor="let s of statuts"
              class="filter-chip"
              [class.active]="statutSelectionne === s"
              (click)="changerStatut(s)">
        {{ s }}
      </button>
    </div>
  </div>

  <!-- Loading -->
  <div *ngIf="chargement" class="loading-state">
    <div class="loading-spinner"></div>
    <p>Chargement des réservations...</p>
  </div>

  <!-- Error -->
  <div *ngIf="!chargement && erreur" class="error-state animate-fade-in">
    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
    <p class="error-message">{{ erreur }}</p>
    <button class="btn btn-outline-primary btn-sm" (click)="reessayer.emit()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
      Réessayer
    </button>
  </div>

  <!-- Empty -->
  <div *ngIf="!chargement && !erreur && reservations.length === 0" class="empty-state animate-fade-in">
    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
    <p>Aucune réservation trouvée</p>
  </div>

  <!-- Table -->
  <div class="card" *ngIf="!chargement && !erreur && reservations.length > 0">
    <div class="card-body">
      <div class="table-responsive">
        <table class="table align-middle">
          <thead>
            <tr>
              <th>Livre</th>
              <th>Adhérent</th>
              <th>Statut</th>
              <th>Réservé le</th>
              <th>Expire le</th>
              <th class="text-end">Action</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let r of reservations" class="animate-fade-in">
              <td>
                <div class="cell-with-icon">
                  <svg class="cell-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
                  <strong>{{ r.livreNom }}</strong>
                </div>
              </td>
              <td>
                <div class="cell-with-icon">
                  <svg class="cell-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                  {{ r.adherentNom }}
                </div>
              </td>
              <td>
                <span class="badge status-pill" [ngClass]="getStatusClass(r.statut)">
                  {{ r.statut }}
                </span>
              </td>
              <td class="date-text">{{ r.dateReservation }}</td>
              <td class="date-text">{{ r.dateExpiration }}</td>
              <td class="text-end">
                <button *ngIf="boutonAnnulationVisible(r)" (click)="demanderAnnulation(r.id)" class="btn btn-sm btn-outline-danger">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>
                  Annuler
                </button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
