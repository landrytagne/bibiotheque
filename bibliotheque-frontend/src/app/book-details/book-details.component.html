<h2 class="page-title">Historique d'emprunt de {{ book.bookName }}</h2>

<div class="card">
    <div class="card-body">
        <div class="table-responsive">
            <table class="table align-middle">
                <thead>
                    <tr>
                        <th> ID utilisateur </th>
                        <th> Date d'emprunt </th>
                        <th> Date de retour </th>
                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor="let borrower of borrow">
                        <td> {{ borrower.userId }} </td>
                        <td> {{ borrower.issueDate }} </td>
                        <td *ngIf="borrower.returnDate != null"> {{ borrower.returnDate }} </td>
                        <td *ngIf="borrower.returnDate === null">
                            <span class="badge rounded-pill not-returned">Non retourné</span>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
