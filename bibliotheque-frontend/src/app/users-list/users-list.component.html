<div class="animate-fade-in-up">
  <div class="page-header">
    <div>
      <h2 class="page-title">Liste des utilisateurs</h2>
      <p class="page-subtitle">{{ users.length }} utilisateur{{ users.length > 1 ? 's' : '' }} inscrit{{ users.length > 1 ? 's' : '' }}</p>
    </div>
  </div>

  <div class="card">
    <div class="card-body">
      <div class="table-responsive">
        <table class="table align-middle">
          <thead>
            <tr>
              <th>ID</th>
              <th>Nom</th>
              <th>Nom d'utilisateur</th>
              <th>Rôle</th>
              <th>Historique</th>
              <th class="text-end">Actions</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let user of users" class="animate-fade-in">
              <td>
                <span class="id-badge">#{{ user.userId }}</span>
              </td>
              <td>
                <div class="user-cell">
                  <div class="user-avatar-sm" [ngClass]="user.role && user.role.length > 0 && user.role[0].roleName === 'Admin' ? 'avatar-admin' : 'avatar-user'">
                    {{ user.name.charAt(0) || '?' }}
                  </div>
                  <strong>{{ user.name }}</strong>
                </div>
              </td>
              <td>
                <span class="username-text">{{ user.username }}</span>
              </td>
              <td>
                <span *ngIf="user.role && user.role.length > 0 && user.role[0].roleName === 'Admin'" class="badge role-badge badge-admin">
                  <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
                  Admin
                </span>
                <span *ngIf="user.role && user.role.length > 0 && user.role[0].roleName === 'User'" class="badge role-badge badge-user">
                  <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                  User
                </span>
                <span *ngIf="!user.role || user.role.length === 0" class="badge role-badge badge-none">
                  Aucun rôle
                </span>
              </td>
              <td>
                <button *ngIf="user.role && user.role.length > 0 && user.role[0].roleName === 'User'" (click)="userDetails(user.userId)" class="btn btn-sm btn-outline-success">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
                  Historique
                </button>
                <span *ngIf="!user.role || user.role.length === 0 || user.role[0].roleName !== 'User'" class="text-muted-dash">—</span>
              </td>
              <td class="text-end">
                <button (click)="updateUser(user.userId)" class="btn btn-sm btn-outline-primary">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
                  Modifier
                </button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
