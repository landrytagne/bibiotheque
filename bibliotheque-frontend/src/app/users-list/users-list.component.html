<h2 class="page-title">Liste des utilisateurs</h2>

<div class="card">
    <div class="card-body">
        <div class="table-responsive">
            <table class="table align-middle">
                <thead>
                    <tr>
                        <th> ID </th>
                        <th> Nom </th>
                        <th> Nom d'utilisateur </th>
                        <th> Rôle </th>
                        <th> Historique </th>
                        <th> Actions </th>
                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor="let user of users">
                        <td> {{ user.userId }} </td>
                        <td> {{ user.name }} </td>
                        <td> {{ user.username }} </td>
                        <td>
                            <span *ngIf="user.role && user.role.length > 0 && user.role[0].roleName === 'Admin'" class="badge rounded-pill badge-admin">
                                Admin
                            </span>
                            <span *ngIf="user.role && user.role.length > 0 && user.role[0].roleName === 'User'" class="badge rounded-pill badge-user">
                                User
                            </span>
                            <span *ngIf="!user.role || user.role.length === 0" class="badge rounded-pill badge-danger-light">
                                Aucun rôle
                            </span>
                        </td>
                        <td>
                            <button *ngIf="user.role && user.role.length > 0 && user.role[0].roleName === 'User'" (click)="userDetails(user.userId)" class="btn btn-sm btn-outline-success">
                                Voir l'historique
                            </button>
                            <span *ngIf="!user.role || user.role.length === 0 || user.role[0].roleName !== 'User'" class="text-muted">—</span>
                        </td>
                        <td>
                            <button (click)="updateUser(user.userId)" class="btn btn-sm btn-outline-primary">
                                Modifier
                            </button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
