<h2 class="page-title">Livres disponibles à emprunter</h2>

<div class="card">
    <div class="card-body">
        <div class="table-responsive">
            <table class="table align-middle">
                <thead>
                    <tr>
                        <th> ID </th>
                        <th> Titre </th>
                        <th> Auteur </th>
                        <th> Genre </th>
                        <th> Exemplaires </th>
                        <th> Actions </th>
                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor="let book of books">
                        <td> {{ book.bookId }} </td>
                        <td> <strong>{{ book.bookName }}</strong> </td>
                        <td> {{ book.bookAuthor }} </td>
                        <td>
                            <span class="badge rounded-pill genre-badge">{{ book.bookGenre }}</span>
                        </td>
                        <td> {{ book.noOfCopies }} </td>
                        <td>
                            <button (click)="borrowBook(book.bookId)" class="btn btn-sm btn-success"><span class="borrow-icon">📥</span> Emprunter</button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
