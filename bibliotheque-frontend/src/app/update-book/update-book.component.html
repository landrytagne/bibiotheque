<div class="page-form animate-fade-in-up">
  <div class="card form-card">
    <div class="form-card-header">
      <div class="form-header-icon icon-amber">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
      </div>
      <h3 class="form-title">Modifier le livre</h3>
      <p class="form-subtitle">Mettez à jour les informations</p>
    </div>

    <div class="card-body">
      <form (ngSubmit)="onSubmit()" autocomplete="off">
        <div class="input-group-custom">
          <label>Titre</label>
          <div class="input-wrapper">
            <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
            <input type="text" class="form-control" id="bookName" [(ngModel)]="book.bookName" name="bookName">
          </div>
        </div>

        <div class="input-group-custom">
          <label>Auteur</label>
          <div class="input-wrapper">
            <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            <input type="text" class="form-control" id="bookAuthor" [(ngModel)]="book.bookAuthor" name="bookAuthor">
          </div>
        </div>

        <div class="row">
          <div class="col-md-6">
            <div class="input-group-custom">
              <label>Genre</label>
              <div class="input-wrapper">
                <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h7"/></svg>
                <input type="text" class="form-control" id="bookGenre" [(ngModel)]="book.bookGenre" name="bookGenre">
              </div>
            </div>
          </div>
          <div class="col-md-6">
            <div class="input-group-custom">
              <label>Exemplaires</label>
              <div class="input-wrapper">
                <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>
                <input type="number" class="form-control" id="noOfCopies" [(ngModel)]="book.noOfCopies" name="noOfCopies">
              </div>
            </div>
          </div>
        </div>

        <button class="btn btn-primary w-100 btn-submit" type="submit">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
          Enregistrer les modifications
        </button>
      </form>
    </div>
  </div>
</div>
