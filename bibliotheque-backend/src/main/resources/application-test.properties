# Configuration de la base pour les tests : H2 en memoire, aucune base externe requise.
spring.datasource.url=jdbc:h2:mem:bibliotheque;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Flyway desactive : le schema est cree par Hibernate a partir des entites.
spring.flyway.enabled=false

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
